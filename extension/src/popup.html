<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <img src="icons/32.png" alt="">
  <b id="brand"></b>
  <select id="market" aria-label="Your market"></select>
</header>
<form id="f" role="search">
  <input id="q" type="search" placeholder="Search sealed product… (e.g. Prismatic ETB)" autocomplete="off" aria-label="Search">
</form>
<button id="page" type="button" class="ghost">Find the product on this page</button>
<h2 id="listTitle"></h2>
<ul id="results" aria-live="polite"></ul>
<p id="status" class="muted"></p>
<nav id="sites" aria-label="Our price comparison sites"></nav>
<footer>
  <label><input id="panel" type="checkbox"> Show the price panel on TCGplayer product pages</label>
  <p class="muted">Prices are the cheapest in-stock store price per market from our last daily update. "Buy" and eBay buttons are affiliate links: we may earn a commission, at no cost to you. <a id="about" target="_blank" rel="noopener">How it works &amp; privacy</a></p>
</footer>
<script src="config.js"></script>
<script src="shared.js"></script>
<script src="popup.js"></script>
</body>
</html>
