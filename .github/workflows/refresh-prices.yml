name: Refresh prices

# The daily import: TCGCSV (TCGplayer's catalogue and prices for every game in SITE.lines) + our sister sites'
# published store offers (checked out beside this repo, read by lib/import/sisters.ts) -> data/ -> commit to main.
# The data commit's SUBJECT carries [deploy]; the build gate allows one production build every 12 hours
# (scripts/vercel-ignore-build.sh), so the import runs TWICE a day, 12 h 10 min apart (owner, 2026-11-14: no eBay
# quota to wait for, so prices refresh as often as the build cap allows). 21:37 UTC follows TCGCSV's ~20:00 UTC
# refresh; 09:47 UTC picks up the sister sites' imports that ran since. No eBay API on this site.

on:
  schedule:
    - cron: "37 21 * * *"
    - cron: "47 9 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-prices
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The import is timed to the build gate (owner's UX review, 2026-11-23, P0 2; freshness.yml says why). A SCHEDULED run whose
  # data commit would land inside the 12 hours after the last production build would be skipped by the gate, so it stops here,
  # unless the prices are already 12 hours old; freshness.yml starts the import once the gate is about to open. A manual or
  # freshness-started run always imports.
  #
  # GitHub also starts the hourly freshness.yml far less often than hourly (24-25 Nov: 3 runs in 28 hours), so a scheduled run that
  # only stopped left the site with no import at all (25 Nov: the 04:32 UTC run stopped, nothing started one, prices 17 hours old).
  # So a scheduled run that would land early now WAITS here until 11 hours after the last build (when freshness.yml would have
  # started it), if that is at most 5 h 30 min away, then checks the gate again and imports. Waiting costs no build: the data
  # commit still lands only once the gate is open.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    outputs:
      run: ${{ steps.age.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 150
      - id: age
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          at=$(node -e 'try{console.log(JSON.parse(require("fs").readFileSync("data/public/meta.json","utf8")).updatedAt||"")}catch{console.log("")}')
          age=$([ -n "$at" ] && echo $(( (now - $(date -u -d "$at" +%s)) / 3600 )) || echo 999)
          built="" built_ts=""
          read -r built built_ts <<< "$(bash scripts/last-build.sh) " || true
          lands=$(( now + 60 * 60 ))  # the quickest import (19-23 Nov) took 64 minutes
          opens=$(( ${built_ts:-0} + 11 * 3600 ))
          if [ "$EVENT" = "schedule" ] && [ "$age" -lt 12 ] && [ -n "${built_ts:-}" ] && [ "$lands" -lt $(( built_ts + 12 * 3600 )) ] \
            && [ $(( opens - now )) -le $(( 330 * 60 )) ]; then
            wait_s=$(( opens - now ))
            echo "Prices ${age}h old; the gate opens 12 hours after the last build (${built:0:7}). Waiting $(( wait_s / 60 )) minutes, then importing."
            sleep "$wait_s"
            git fetch -q --depth=150 origin main && git checkout -q FETCH_HEAD
            now=$(date -u +%s)
            read -r built built_ts <<< "$(bash scripts/last-build.sh) " || true
            lands=$(( now + 60 * 60 ))
          fi
          if [ "$EVENT" = "schedule" ] && [ "$age" -lt 12 ] && [ -n "${built_ts:-}" ] && [ "$lands" -lt $(( built_ts + 12 * 3600 )) ]; then
            echo "Prices ${age}h old; the last build (${built:0:7}) was under 12 hours before this import would land, so the gate would skip it. freshness.yml starts the import when the gate opens."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Prices ${age}h old: importing."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
  import:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Our sister sites' public data (their repositories are public): only the data and store-list folders.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Specifxx/CompareEmpire
          path: sisters/CompareEmpire
          sparse-checkout: |
            apps/dexcompare-sealed/data/public
            apps/dexcompare-sealed/src/data
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Specifxx/mtgcompare
          path: sisters/mtgcompare
          sparse-checkout: |
            data/public
            src/data
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Specifxx/ygocompare
          path: sisters/ygocompare
          sparse-checkout: |
            data/public
            src/content
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Specifxx/lorcanacompare
          path: sisters/lorcanacompare
          sparse-checkout: |
            data/public
            src/content
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Specifxx/GundamCompare
          path: sisters/GundamCompare
          sparse-checkout: |
            data/public
            src/content
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Specifxx/bandaicompare
          path: sisters/bandaicompare
          sparse-checkout: |
            data/public
            src/content
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Specifxx/cyberpunkcompare
          path: sisters/cyberpunkcompare
          sparse-checkout: |
            data/public
            src/content
          sparse-checkout-cone-mode: true
      # OP Compare keeps its public data on its `snapshot` branch (sealed ids are TCGplayer's) and its store list on main.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Specifxx/OpCompare
          ref: snapshot
          path: sisters/OpCompare-snapshot
          sparse-checkout: |
            o
            sealed.json.gz
            meta.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Specifxx/OpCompare
          path: sisters/OpCompare
          sparse-checkout: |
            src/lib/stores.ts
          sparse-checkout-cone-mode: false
      # Rift Compare (Riftbound) commits its public data to main: only the sealed listings and their meta (never
      # data/public/listings/, about 84 MB of singles).
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Specifxx/TCGEmpire
          path: sisters/TCGEmpire
          sparse-checkout: |
            data/public/sealed-listings.json
            data/public/meta.json
          sparse-checkout-cone-mode: false
      # Our own crawl of the games no sister covers (lib/import/crawl.ts): reads the collections data/crawl/stores.json
      # names (robots.txt, one request a second per store, two stores at a time, a 401/403/429 or challenge stops the
      # store) and leaves its listings in the git-ignored data/crawl/listings.json for the import. A no-op until the
      # weekly Crawl probe has found stores; never fatal: without it the import carries the last rows for 72 hours.
      - name: Own crawl (games no sister covers)
        continue-on-error: true
        timeout-minutes: 100
        env:
          # The sisters' collections plus data/crawl/own-stores.json (owner, 2026-11-15): more stores, so a longer read;
          # the stores tried longest ago go first, so what one run cannot reach the next does.
          CRAWL_BUDGET: "12000"
          CRAWL_MAX_MINUTES: "90"
        run: npx tsx scripts/crawl-uncovered.ts
      # AI placements of id-less listings (scripts/ai-shadow-match.ts, DECISIONS.md 2026-11-16): the decisions live in
      # cache.json on the never-deployed ai-shadow branch. The import takes them with light sanity checks only (lib/import/
      # crawl.ts pickByAi). Roll back with the repository variable AI_SHADOW_LIVE=0; no branch or cache means none are used.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: ai-shadow
          path: ai-shadow
      - name: Import
        env:
          SISTER_DIR: sisters
          AI_SHADOW_LIVE: ${{ vars.AI_SHADOW_LIVE || '1' }}
        run: |
          if [ -f ai-shadow/cache.json ]; then cp ai-shadow/cache.json data/crawl/ai-shadow-cache.json; fi
          npx tsx scripts/import-all.ts
      # Amazon ASINs for the sealed pages' Amazon row (Creators API searchItems, matched by the store matcher; ASINs only,
      # prices are fetched by each Vercel build and never committed: DECISIONS.md 2026-11-05). A no-op until the secrets exist.
      - name: Amazon ASINs (Creators API)
        continue-on-error: true
        env:
          AMAZON_CREATORS_AU_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_AU_CLIENT_ID }}
          AMAZON_CREATORS_AU_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_AU_CLIENT_SECRET }}
          AMAZON_CREATORS_AU_VERSION: ${{ secrets.AMAZON_CREATORS_AU_VERSION }}
          AMAZON_CREATORS_US_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_US_CLIENT_ID }}
          AMAZON_CREATORS_US_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_US_CLIENT_SECRET }}
          AMAZON_CREATORS_US_VERSION: ${{ secrets.AMAZON_CREATORS_US_VERSION }}
        run: npx tsx scripts/amazon-asins.ts
      # The Compare Empire network (scripts/family-sync.ts): this site's best deals and pre-orders for
      # its sisters, and their feeds for this site's "Also in this cluster" blocks. Never fatal.
      - name: Family feed
        continue-on-error: true
        run: npx tsx scripts/family-sync.ts
      # The open price data (scripts/open-index.ts): today's US basket and the chained Sealed Price Index. Never fatal.
      - name: Open price index
        continue-on-error: true
        run: npx tsx scripts/open-index.ts
      # Back in stock (scripts/restocks.ts, lib/restocks.ts): offers sold out in the last commit and in stock now, kept 7 days
      # in data/public/restocks.json for /restocks. Display only. Never fatal.
      - name: Restocks
        continue-on-error: true
        run: npx tsx scripts/restocks.ts
      # Sealed Sniper (scripts/sniper.ts, lib/sniper.ts, DECISIONS.md 2026-11-19): this run's restocks and price drops of
      # sealed Pokémon, One Piece, Riftbound, Magic and Lorcana, each checked once at the store right before it is posted to
      # Discord and to t.me/tcgdealsrestocks (one message each a run). A no-op until DISCORD_SNIPER_WEBHOOK or TELEGRAM_BOT_TOKEN exists. Before the data commit: HEAD is the last prices.
      - name: Sealed Sniper
        continue-on-error: true
        timeout-minutes: 15
        env:
          DISCORD_SNIPER_WEBHOOK: ${{ secrets.DISCORD_SNIPER_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
        run: npx tsx scripts/sniper.ts
      # The home pages' ranking input (src/lib/home-rank.ts, DECISIONS.md 2026-11-18): product page views and buy clicks per
      # item, last 28 and 7 days, from RiftCompare's /api/demand/tcgprices, written into the data commit below.
      #  Never fatal: a failed fetch keeps yesterday's file and the home page keeps its order.
      - name: Home page demand
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: DEMAND_WRITE_ONLY=1 bash scripts/pull-demand.sh tcgprices data/demand.json
      - name: Commit data (this commit is the daily release)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: daily prices $(date -u +%F) [deploy]" -m "Written by refresh-prices.yml. This is the one scheduled production build a day."
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            sleep $((2 ** i)); git pull --rebase origin main
          done
          exit 1
      - name: IndexNow
        if: success()
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
        run: npx tsx scripts/indexnow-submit.ts || true
      # What IndexNow was sent and at what price (data/state/indexnow.json). A separate commit WITHOUT a deploy marker.
      - name: Commit IndexNow state
        if: success()
        run: |
          # No INDEXNOW_KEY means the script writes no record: nothing to commit, and a bare `git add` of the missing
          # file failed every refresh red after the prices had already landed (17-18 Nov).
          [ -f data/state/indexnow.json ] || exit 0
          git add data/state/indexnow.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: IndexNow record"
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main) || true
