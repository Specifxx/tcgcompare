# Daily company video: records phone-sized clips of live pages (Playwright through Chrome's
# screencast, 1080x1920) for the owner's private end-of-day video. The cloud agent that makes the
# video cannot reach our sites, so it dispatches this with the day's demo list and reads the clips
# back from the `daily-demos` branch (one orphan commit, force-pushed: only the latest day is kept).
# Public pages only; the video's numbers are added privately by the agent, never here.
# Dispatch-only: no schedule, never deploys (vercel.json "**": false), no [deploy] marker.
name: Daily demo clips

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Day the clips are for (YYYY-MM-DD)"
        required: true
      demos:
        description: 'JSON list: [{"id":"x","steps":[{"goto":"https://..."},{"scroll":900,"ms":2500}]}]'
        required: true

permissions:
  contents: write

concurrency:
  group: daily-demos
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/daily-video
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p /tmp/rec && cd /tmp/rec && npm init -y >/dev/null && npm i -s playwright@1.49.1
          npx playwright install --with-deps chromium >/dev/null
      - name: Record
        env:
          DEMOS: ${{ inputs.demos }}
          DAY: ${{ inputs.day }}
        run: |
          case "$DAY" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "bad day"; exit 1;; esac
          cp scripts/daily-video/record.mjs /tmp/rec/
          printf '%s' "$DEMOS" > /tmp/rec/demos.json
          cd /tmp/rec && node record.mjs demos.json "out/$DAY"
      - name: Publish to the daily-demos branch
        env:
          DAY: ${{ inputs.day }}
        run: |
          cd /tmp/rec/out
          git init -q -b daily-demos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/rec/demos.json "$DAY/demos.json"
          git add -A && git commit -q -m "Daily demo clips $DAY"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" daily-demos
